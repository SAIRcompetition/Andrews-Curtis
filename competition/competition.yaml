id: acms
name: "The Andrews–Curtis Conjecture (ACC) Challenge"
organizer: sairmath
status: prelaunch
task_type: mathematical_discovery
submission_artifact: submission.json
submission_format: "Discovery: JSON; solutions[] of {challenge_id, moves[]}; ac-v1- IDs select AC moves 0-13 and sac-v1- IDs select stable AC moves 0-256"
verifier: "Discovery Track: Python, competition/tools/verifier (standard library only), acms-verify 0.2.0"
primary_metric: leaderboard_score
scoring_unit: team_challenge
scoring_formula: "V_i * 2^(1-k_i) for teams at the current shortest length, 0 otherwise"
tracks:
  - id: discovery
    name: Discovery Track
    opens: "2026-09-11"
    opens_at: null
    objective: "Find short verified trivializations of the published presentations"
    leaderboards: independent_per_problem
    problems:
      - id: ac
        name: AC
        id_prefix: ac-v1-
        move_spec_version: ac-r2-v1
        target: "The ordered pair (x, y), at fixed rank 2"
      - id: stable_ac
        name: Stable AC
        id_prefix: sac-v1-
        move_spec_version: sac-r8-v1
        target: "The empty presentation, with current rank at most 8"
  - id: proof
    name: Proof Track
    opens: "2026-09-21"
    opens_at: null
    statement: rules/statement.md
    submission_format: "Conjecture, claim type, and description required; complete argument in description, PDF or paper, GitHub at a fixed commit, or arXiv at a fixed version"
    visibility: public
    versions: immutable
    review: "Community peer review through public versions and comments, including Lean submissions; organizers may assess selected claims for competition recognition"
    credit: "Earliest eligible complete correct version, with references and contributions recorded; see rules/evaluation.md"
    leaderboard_points: false
    problems:
      - id: ac
        name: AC
        conjecture: AC.Conjecture
        claims: [proof, disproof]
      - id: stable_ac
        name: Stable AC
        conjecture: AC.StableConjecture
        claims: [proof, disproof]
move_specs:
  - version: ac-r2-v1
    hash: "sha256:e13f57d82b5db1a79c1bd9d5ee1f6665ac4d96a634a3656ea20c0ada82e07643"
    file: challenges/move_spec.json
    target_relators: [[1], [2]]
